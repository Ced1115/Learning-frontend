<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>CSS Selector</h1>
    <article>
        <h2>Article 1</h2>
        <p class="highlight">this is the first paragraph</p>
    </article>
    <article>
        <h2>Article 2</h2>
        <p id="second" class="gray">this is the second paragraph</p>
    </article>
    <article>
        <h2>Article 3</h2>
        <p class="gray">this is the <span class="highlight">third</span> paragraph</p>
    </article>
</body>
</html>
